name: Publish GyeonggiCash APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: gyeonggicash-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release selection
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Select signed GyeonggiCash build
        id: apk
        run: python3 scripts/select_release_apk.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.apk.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.apk.outputs.skip != 'true'
        with:
          packages: 'platform-tools build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Download and verify original signed APK
        if: steps.apk.outputs.skip != 'true'
        env:
          APK_URL: ${{ steps.apk.outputs.url }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_DIGEST: ${{ steps.apk.outputs.digest }}
          APK_VERSION: ${{ steps.apk.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 3 "$APK_URL" --output "dist/$APK_NAME"
          printf '%s  %s\n' "${APK_DIGEST#sha256:}" "dist/$APK_NAME" | sha256sum --check
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/$APK_NAME" > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "dist/$APK_NAME" > "$RUNNER_TEMP/badging.txt"
          grep -F "name='kr.local.timedclick'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='$APK_VERSION'" "$RUNNER_TEMP/badging.txt"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - name: Publish APK in GyeonggiCash Releases
        if: steps.apk.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GyeonggiCash ${{ steps.apk.outputs.version }}
          body: 'Original signed build: ${{ steps.apk.outputs.release_url }}'
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
